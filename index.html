<style>
#splash{position:fixed;inset:0;z-index:200;background:#0e1621;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .25s;color:#fff;font-family:Tahoma,'Segoe UI',system-ui,sans-serif}
#splash .lg{width:96px;height:96px;border-radius:26px;background:linear-gradient(135deg,#2a5fd6,#0d2452);display:flex;align-items:center;justify-content:center;box-shadow:0 0 34px rgba(60,120,255,.55)}
#splash .nm{font-size:22px;font-weight:700}
#splash .ic,.lockpage .ic{width:132px;height:132px;border-radius:30px;display:block}
html.locked #app,html.locked #toast{display:none!important}
.lockpage{position:fixed;inset:0;z-index:95;background:#0e1621;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'Vazirmatn',Tahoma,sans-serif}
.lockpage .box{width:100%;max-width:340px}
.lockpage .lg{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#2a5fd6,#0d2452);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 30px rgba(60,120,255,.5)}
.lockpage h2{margin:0 0 6px;font-size:20px}
.lockpage p{margin:0 0 14px;color:#9fc1ff}
.lockpage input{width:100%;min-height:50px;border-radius:12px;border:1px solid #3390ec;background:rgba(255,255,255,.07);color:#fff;padding:9px 12px}
.lockpage .btn{background:#3390ec;color:#fff;border-color:transparent;width:100%;margin-top:12px}
.lockpage .msg{color:#ff9a9a;font-size:14px;margin-top:8px}
</style>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0e1621;--s1:#17212b;--s2:#1f2c3a;--bd:#243447;--tx:#f5f8fb;--mu:#8da2b6;
  --ac:#3390ec;--acx:#ffffff;--ok:#4fcba1;--bad:#ff8878;--zero:#9aa5ba;
  --okbg:rgba(79,203,161,.13);--badbg:rgba(255,136,120,.13);--zerobg:rgba(154,165,186,.13);
  color-scheme:dark;
}



/* themes (Telegram style) */
html[data-theme=night]{--bg:#0e1621;--s1:rgba(23,33,43,.78);--s2:rgba(32,46,60,.8);--sheet:#17212b;--bd:rgba(120,150,180,.18);--tx:#f5f8fb;--mu:#8da2b6;--ac:#3390ec;--acx:#ffffff;--ok:#5ed6a4;--bad:#ff8f84;--zero:#9fb2c4;--okbg:rgba(94,214,164,.14);--badbg:rgba(255,143,132,.14);--zerobg:rgba(159,178,196,.15);color-scheme:dark}
html[data-theme=day]{--bg:#d5e6f6;--s1:rgba(255,255,255,.84);--s2:rgba(244,249,254,.88);--sheet:#ffffff;--bd:rgba(40,100,160,.16);--tx:#17212b;--mu:#62788d;--ac:#2481cc;--acx:#ffffff;--ok:#148a5a;--bad:#c9382e;--zero:#5f7487;--okbg:rgba(20,138,90,.1);--badbg:rgba(201,56,46,.1);--zerobg:rgba(95,116,135,.1);color-scheme:light}
html[data-theme=mint]{--bg:#d9e8cf;--s1:rgba(255,255,255,.82);--s2:rgba(246,252,243,.86);--sheet:#ffffff;--bd:rgba(50,110,80,.18);--tx:#1b2a22;--mu:#5f7a68;--ac:#2481cc;--acx:#ffffff;--ok:#148a5a;--bad:#c9382e;--zero:#5f7487;--okbg:rgba(20,138,90,.1);--badbg:rgba(201,56,46,.1);--zerobg:rgba(95,116,135,.1);color-scheme:light}
html[data-theme=dusk]{--bg:#150e2e;--s1:rgba(30,22,64,.74);--s2:rgba(44,32,92,.74);--sheet:#1d1640;--bd:rgba(170,150,255,.2);--tx:#f1eeff;--mu:#aca4d6;--ac:#3390ec;--acx:#ffffff;--ok:#5ed6a4;--bad:#ff8f84;--zero:#9fb2c4;--okbg:rgba(94,214,164,.14);--badbg:rgba(255,143,132,.14);--zerobg:rgba(159,178,196,.15);color-scheme:dark}
html[data-theme=teal]{--bg:#07201f;--s1:rgba(10,40,42,.74);--s2:rgba(16,58,60,.74);--sheet:#0c2e30;--bd:rgba(120,220,210,.2);--tx:#eafbf9;--mu:#8fb5b1;--ac:#3390ec;--acx:#ffffff;--ok:#5ed6a4;--bad:#ff8f84;--zero:#9fb2c4;--okbg:rgba(94,214,164,.14);--badbg:rgba(255,143,132,.14);--zerobg:rgba(159,178,196,.15);color-scheme:dark}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.75;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}
.app{max-width:720px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;background:var(--bg);padding:10px 0;margin:0 -14px 8px;padding-inline:10px;border-bottom:1px solid var(--bd)}
.top h1{flex:1;margin:0;font-size:19px;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:4px}
.acts{display:flex;gap:2px}
.ib{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:12px;color:var(--tx)}
.ib:hover{background:var(--s1)}

/* cards and buttons */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.badge-flag{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-size:12px;font-weight:600}
.pin-ic{color:var(--ac)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dash div{text-align:center}
.dash small{display:block;color:var(--mu);font-size:12px;margin-bottom:2px}
.dash b{font-size:18px}
.gsec{margin:14px 0 6px;font-size:13px;color:var(--mu);font-weight:600}
.trend{margin-top:12px}
button.card{width:100%;text-align:start}
.rem{display:block}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ac);color:var(--acx);border-color:transparent}
.btn.dng{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.wide{width:100%}
.btns{display:grid;gap:10px;margin-top:16px}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.row-btns .btn{padding:0 10px;font-size:14px;text-align:center}
.stack{display:grid;gap:10px}

/* pills */
.pill{display:inline-block;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:600;line-height:1.8}
.pill.cred{color:var(--ok);background:var(--okbg)}
.pill.debt{color:var(--bad);background:var(--badbg)}
.pill.zero{color:var(--zero);background:var(--zerobg)}
.chip{display:inline-block;padding:0 9px;border-radius:8px;font-size:12px;background:var(--s2);color:var(--mu);border:1px solid var(--bd)}

/* home */
.co{display:flex;align-items:center;justify-content:space-between;gap:12px}
.co-name{font-weight:700;font-size:16px}
.co-sub{font-size:13px;color:var(--mu);display:flex;gap:12px;flex-wrap:wrap}
.co-end{text-align:end;display:grid;gap:2px;justify-items:end;flex-shrink:0}
.co-amt{font-weight:700;font-size:15px}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:15;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.bar .btn{max-width:692px;margin:0 auto;display:flex}
.empty{text-align:center;padding:44px 18px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.note{border-inline-start:4px solid var(--ac);border-radius:8px;background:var(--s1);padding:10px 14px;margin-bottom:12px;font-size:14px}
.note.warn{border-color:var(--bad)}
.note .btn{min-height:38px;margin-top:8px;font-size:14px}
.search{margin-bottom:12px}

/* company page */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kind{display:grid;gap:2px}
.kind-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}

<style>
/* company page */
.csum{text-align:center;padding:22px 18px 18px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 10%,var(--s1)),var(--s1) 70%);border-color:color-mix(in srgb,var(--ac) 28%,var(--bd))}
.csum .lbl{color:var(--mu);font-size:13px}
.csum .big{font-size:38px;font-weight:800;line-height:1.3;margin:4px 0 6px;letter-spacing:-.5px}
.csum .big.cred{color:var(--ok)}.csum .big.debt{color:var(--bad)}.csum .big.zero{color:var(--tx)}
.csum .why{font-size:13px;color:var(--mu);margin-top:10px}
.csum .split{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:16px auto 0;max-width:260px;background:var(--bd)}
.csum .split i{display:block;height:100%}
.csum .split .a{background:var(--ok)}.csum .split .b{background:var(--bad)}
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.kt{display:grid;gap:4px;text-align:start;padding:14px 14px 12px;border-radius:18px}
.kt .kh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.kt .kc{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.kt .kc svg{width:16px;height:16px}
.kt.read .kh{color:var(--ok)}.kt.read .kc{background:var(--okbg)}
.kt.paid .kh{color:var(--bad)}.kt.paid .kc{background:var(--badbg)}
.kt .kn{color:var(--mu);font-size:14px}
.kt .kv{font-size:19px;font-weight:700;margin-top:2px}
/* company page: read and paid stacked, one under the other */
.duo2{grid-template-columns:1fr;gap:10px}
.kt{grid-template-columns:1fr auto;grid-template-areas:"kh kv" "kn kv";align-items:center;column-gap:12px;row-gap:4px;padding:14px 16px}
.kt .kh{grid-area:kh}.kt .kn{grid-area:kn}
.kt .kv{grid-area:kv;font-size:24px;margin:0;text-align:end}
/* personal account page: remaining / added / withdrawn stacked, names right, amounts left */
.psum.stk{text-align:start;padding:4px 18px 16px}
.psum.stk .prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0}
.psum.stk .prow.rem{border-bottom:0}
.psum.stk .main{font-size:28px;margin:0;line-height:1.3;font-weight:800;text-align:end}
.psum.stk .lbl{font-size:15px;font-weight:700;color:var(--tx)}
.psum.stk .two{display:block}
.psum.stk .two::before{display:none}
.psum.stk .tile{display:flex;padding:15px 0;border-radius:0}
.psum.stk .tile.in{border-bottom:1px solid var(--bd);grid-column:auto;grid-row:auto}
.psum.stk .tile.out{grid-column:auto;grid-row:auto;border-bottom:1px solid var(--bd)}
.psum.stk .tile small{justify-content:flex-start;font-size:15px;font-weight:700}
.psum.stk .tile b{display:block;margin:0;font-size:22px;text-align:end}
.psum.stk .pbar{margin:6px 0 0;max-width:none}
.psum.stk .pcap{margin-top:8px;text-align:start}
.csum + .duo2 + .card.trend,.card.trend{margin-top:0}
.ledger+.card.trend{margin-top:12px}
</style>
</head>

  var r=calc(c.read),p=calc(c.paid),diff=r.total-p.total;
  return {r:r,p:p,diff:diff,st:statusOf(diff)};
}
function lastActivity(c){
  var t='';
  c.read.concat(c.paid).forEach(function(r){if(r.createdAt>t)t=r.createdAt});
  return t;
}
function isFlagged(c){
  var s=summary(c);
  if(!s.diff)return false;
  if(Math.abs(s.diff)>=db.debtThreshold)return true;
  var la=lastActivity(c);
  if(!la)return false;
  var days=Math.floor((Date.now()-new Date(la).getTime())/864e5);
  return days>=db.inactiveDays;
}
function dashboardTotals(){
  var cred=0,debt=0;
  db.companies.forEach(function(c){var s=summary(c);if(s.st==='cred')cred+=Math.abs(s.diff);else if(s.st==='debt')debt+=Math.abs(s.diff)});
  return {cred:cred,debt:debt};
}

function trendChart(c){
  var pts=c.closed.slice().sort(function(a,b){return a.closedAt<b.closedAt?-1:1});
  if(pts.length<2)return '<div class="card trend mu" style="font-size:13px">برای دیدن نمودار روند، حداقل ۲ ماه را ببندید.</div>';
  var w=320,h=90,pad=8,vals=pts.map(function(x){return x.diff});
  var mx=Math.max.apply(null,vals.concat([0])),mn=Math.min.apply(null,vals.concat([0]));
  var rng=(mx-mn)||1;
  var step=(w-pad*2)/(pts.length-1);
  var zy=h-pad-((0-mn)/rng)*(h-pad*2);
  var path=pts.map(function(x,i){
    var px=pad+i*step,py=h-pad-((x.diff-mn)/rng)*(h-pad*2);
    return (i?'L':'M')+px.toFixed(1)+','+py.toFixed(1);
  }).join(' ');
  var dots=pts.map(function(x,i){
    var px=pad+i*step,py=h-pad-((x.diff-mn)/rng)*(h-pad*2);
    return '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3" fill="'+(x.diff>0?'var(--bad)':x.diff<0?'var(--ok)':'var(--zero)')+'"/>';
  }).join('');
  return '<div class="card trend"><div class="gsec" style="margin:0 0 8px">روند ماهانه (تفاوت حساب)</div>'+
    '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="overflow:visible">'+
    '<line x1="'+pad+'" y1="'+zy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zy.toFixed(1)+'" stroke="var(--bd)" stroke-width="1"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--ac)" stroke-width="2"/>'+dots+'</svg>'+
    '<div class="rem-bot"><span>'+esc(pts[0].label)+'</span><span>'+esc(pts[pts.length-1].label)+'</span></div></div>';
}
function avaH(n){var t=String(n||'').trim();return '<span class="ava" aria-hidden="true">'+esc(t?Array.from(t)[0].toUpperCase():'•')+'</span>'}
function companyCards(q){
  var cs=db.companies.slice().sort(function(a,b){
    if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;
    return a.name.localeCompare(b.name,'fa');
  });
  if(q)cs=cs.filter(function(c){return norm(c.name).indexOf(norm(q))>-1});
  if(!db.companies.length)return '<div class="empty"><b>'+L('هنوز حسابی ثبت نشده')+'</b>'+L('با «افزودن حساب» اولین شرکت یا صراف را اضافه کنید.')+'</div>';
  if(!cs.length)return q?'':'<div class="empty"><b>'+L('حسابی پیدا نشد')+'</b>'+L('نام دیگری را جستجو کنید.')+'</div>';
  return (cs.length?'<div class="gsec">'+L('حساب‌ها')+'</div>':'')+'<div class="stack">'+cs.map(function(c){
    var s=summary(c),fl=isFlagged(c);
    return '<button class="card co" data-act="openCo" data-id="'+c.id+'">'+avaH(c.name)+'<div><div class="co-name">'+(c.pinned?'<span class="pin-ic">'+I.pin+'</span> ':'')+esc(c.name)+'</div><div class="co-sub"><span>'+D(s.r.count)+' '+L('حواله')+' '+KL('read')+'</span><span>'+D(s.p.count)+' '+L('حواله')+' '+KL('paid')+'</span></div>'+(fl?'<div class="badge-flag">'+I.flag+' '+L('نیاز به پیگیری')+'</div>':'')+'</div>'+
      '<div class="co-end">'+pill(s.st)+(s.diff?'<div class="co-amt">'+money(Math.abs(s.diff))+'</div>':'')+'</div></button>';
  }).join('')+'</div>';
}
function backupNote(){
  if(!db.companies.length)return '';
  var days=db.lastBackup?Math.floor((Date.now()-new Date(db.lastBackup).getTime())/864e5):null;
  if(days!==null&&days<7)return '';
  var txt=days===null?L('هنوز از اطلاعات پشتیبان نگرفته‌اید. داده‌ها فقط روی همین مرورگر ذخیره می‌شوند.'):(db.lang==='en'?('Last backup was '+D(days)+' days ago.'):('آخرین پشتیبان '+D(days)+' روز پیش بود.'));
  return '<div class="note no-print">'+txt+'<br><button class="btn" data-act="backupSheet">'+L('پشتیبان‌گیری')+'</button></div>';
}

function persBal(a){return a.tx.reduce(function(t,x){return t+(x.type==='sub'?-x.amount:x.amount)},0)}
function balHTML(n){return '<span class="'+(n<0?'bal-neg':'bal-pos')+'"><bdi dir="ltr">'+(n<0?'−':'')+money(Math.abs(n))+'</bdi></span>'}
function persMatch(a,q){
  var n=norm(toLatin(q));if(!n)return true;
  if(norm(a.name).indexOf(n)>-1||norm(a.note||'').indexOf(n)>-1)return true;
  var dig=toLatin(q).replace(/[^\d]/g,'');
  return a.tx.some(function(x){return norm(x.note).indexOf(n)>-1||(dig&&String(x.amount).indexOf(dig)>-1)});
}
function personalCards(q){
  var all=(db.personal||[]).slice().sort(function(a,b){return a.name.localeCompare(b.name,'fa')});
  var list=q?all.filter(function(a){return persMatch(a,q)}):all;
  if(all.length&&!list.length)return '<div class="empty"><b>'+L('چیزی پیدا نشد')+'</b>'+L('نام حساب، توضیح یا مبلغ دیگری را امتحان کنید.')+'</div>';
  if(!list.length)return '<div class="empty"><b>'+L('هنوز حساب شخصی ثبت نشده')+'</b>'+L('با «افزودن حساب شخصی» اولین حساب را بسازید.')+'</div>';
  return '<div class="gsec">'+L('حساب‌های شخصی')+'</div><div class="stack">'+list.map(function(a){
    return '<button class="card co" data-act="openPers" data-id="'+a.id+'">'+avaH(a.name)+'<div><div class="co-name">'+esc(a.name)+'</div><div class="co-sub"><span>'+D(a.tx.length)+' '+L('تراکنش')+'</span></div></div><div class="co-end"><div class="co-amt">'+balHTML(persBal(a))+'</div></div></button>';
  }).join('')+'</div>';
}

function persTot(a){
  var ad=0,sb=0;a.tx.forEach(function(x){if(x.type==='sub')sb+=x.amount;else ad+=x.amount});
  return {add:ad,sub:sb,bal:ad-sb};
}
V.pers=function(p){
  var a=pa(p.pid),t=persTot(a),bal=t.bal,pct=t.add?Math.min(100,Math.round(t.sub/t.add*100)):0;
  var rows='',last=null;
  if(a.tx.length){
    a.tx.slice().sort(byNew).forEach(function(x){
      var dk=String(x.date||'');
      if(dk!==last){rows+=(last===null?'':'</div>')+'<div class="txg">'+fmtDate(x.date)+'</div><div class="txl">';last=dk}
      var sub=x.type==='sub';
      rows+='<button class="txr" data-act="openPtx" data-id="'+x.id+'"><span class="txi '+(sub?'o':'i')+'">'+(sub?I.out:I.inn)+'</span>'+
        '<span class="txm"><b>'+L(sub?'برداشت':'اضافه کردن')+'</b>'+(x.note?'<small>'+esc(x.note)+'</small>':'')+'</span>'+
        '<span class="txa '+(sub?'bal-neg':'bal-pos')+'"><bdi dir="ltr">'+(sub?'−':'+')+money(x.amount)+'</bdi></span></button>';
    });

  }else rows='<div class="empty"><b>'+L('هنوز تراکنشی ثبت نشده')+'</b></div>';
  return header(a.name,{back:true,actions:[menuBtn('persMenu')]})+
  '<main><section class="card psum stk"><div class="two"><div class="prow tile in"><small>'+I.inn+' '+L('کل اضافه‌شده')+'</small><b>'+money(t.add)+'</b></div><div class="prow tile out"><small>'+I.out+' '+L('کل برداشت‌شده')+'</small><b>'+money(t.sub)+'</b></div></div>'+
    '<div class="prow rem"><span class="lbl">'+L('مبلغ باقی‌مانده')+' ('+L('افغانی')+')</span><span class="main">'+balHTML(bal)+'</span></div>'+
    (t.add?'<div class="pbar"><i style="width:'+pct+'%"></i></div>':'')+
    (t.add?'<div class="pcap">'+D(pct)+'٪ '+L('از مبلغ اضافه‌شده برداشت شده')+'</div>':'')+'</section>'+
  '<div class="qa no-print"><button class="qb in" data-act="persAdd"><span class="qc in">'+I.plus+'</span><b>'+L('اضافه کردن')+'</b></button><button class="qb out" data-act="persSub"><span class="qc out">'+I.out+'</span><b>'+L('برداشت')+'</b></button></div>'+

function dateSelects(iso){
  var g=iso.split('-').map(Number),greg=db.dateFmt==='greg';
  var t=greg?g:g2j(g[0],g[1],g[2]),names=greg?GMONTHS:MONTHS;
  var cy=greg?new Date().getFullYear():jToday()[0],d='',m='',y='',i;
  for(i=1;i<=31;i++)d+='<option value="'+i+'"'+(i===t[2]?' selected':'')+'>'+D(i)+'</option>';
  for(i=0;i<12;i++)m+='<option value="'+(i+1)+'"'+(i+1===t[1]?' selected':'')+'>'+names[i]+'</option>';
  var lo=Math.min(greg?2025:1404,t[0]),hi=Math.max(greg?2035:1414,t[0]);
  for(i=hi;i>=lo;i--)y+='<option value="'+i+'"'+(i===t[0]?' selected':'')+'>'+D(i)+'</option>';
  return '<div class="field" id="fld_date"><label>'+L('تاریخ')+' ('+L(greg?'میلادی':'شمسی')+')</label><div class="three"><select id="f_d" aria-label="'+(db.lang==='en'?'Day':'روز')+'">'+d+'</select><select id="f_m" aria-label="'+(db.lang==='en'?'Month':'ماه')+'">'+m+'</select><select id="f_y" aria-label="'+(db.lang==='en'?'Year':'سال')+'">'+y+'</select></div><div class="msg" id="msg_date" hidden></div></div>';
}

var dlCache;
function getDL(){
  if(dlCache!==undefined)return Promise.resolve(dlCache);
  if(!(window.claude&&window.claude.use)){dlCache=false;return Promise.resolve(false)}
  return window.claude.use('downloads').then(function(x){dlCache=x||null;return dlCache},function(){dlCache=null;return null});
}
function saveFile(name,data,mime){
  return getDL().then(function(dl){
    if(dl){
      return dl.save({filename:name,data:data}).then(function(){return 'saved'},function(e){
        if(e&&(e.code==='declined'))return 'declined';
        if(e&&e.code==='rate_limited'){toast('کمی صبر کنید و دوباره تلاش کنید');return 'declined'}
        return 'fail';
      });
    }
    if(dl===false){
      try{
        var u=URL.createObjectURL(new Blob([data],{type:mime}));
        var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(u)},2000);return 'saved';
      }catch(e){return 'fail'}
    }
    return 'fail';
  });
}

  var head=['حساب','نوع','شماره حواله','تاریخ','فرستنده','گیرنده','ولد گیرنده','شماره تذکره','ساعت','نوع شماره تماس','شماره تماس','مبلغ (افغانی)','مبلغ به حروف','محل پرداخت','توضیحات','تعداد ارسال','ویرایش‌شده'];
  var rows=[head];
  list.forEach(function(c){
    ['read','paid'].forEach(function(k){
      c[k].slice().sort(function(a,b){return -byNew(a,b)}).forEach(function(r){
        rows.push([c.name,KIND[k],r.no,fmtDate(r.date).replace(/[۰-۹]/g,function(d){return FA_D.indexOf(d)}),r.sender,r.receiver,r.fatherName,r.idCard,r.time||'',r.phone?L(PH_T[r.phoneType||'hd']):'',r.phone||'',r.amount,words(r.amount),r.place,r.notes,r.shares,r.edited?'بله':'']);

var LOCK_KEY='hawalabase_lock_cfg';
function loadLockCfg(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'null')||{enabled:false,method:'',pinHash:'',credId:''}}catch(e){return {enabled:false,method:'',pinHash:'',credId:''}}}
function saveLockCfg(cfg){try{localStorage.setItem(LOCK_KEY,JSON.stringify(cfg))}catch(e){}}
function hashPin(pin){
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode('hawala:'+pin)).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
  });
}
function b64u(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64uToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer}
function webauthnAvailable(){
  return !!(window.PublicKeyCredential&&navigator.credentials)&&
    (PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable():Promise.resolve(false));
}
function webauthnSetup(){
  var challenge=crypto.getRandomValues(new Uint8Array(32)),userId=crypto.getRandomValues(new Uint8Array(16));
  return navigator.credentials.create({publicKey:{
    challenge:challenge,rp:{name:'HawalaBase Ledger'},user:{id:userId,name:'hawalabase-user',displayName:'HawalaBase User'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000
  }}).then(function(cred){return b64u(cred.rawId)});
}
function webauthnVerify(credId){
  var challenge=crypto.getRandomValues(new Uint8Array(32));
  return navigator.credentials.get({publicKey:{
    challenge:challenge,allowCredentials:[{id:b64uToBuf(credId),type:'public-key'}],userVerification:'required',timeout:60000
  }});
}

A.encSetupGo=function(){
  var m=$('#msg_encs'),p1=$('#enc_p1').value,p2=$('#enc_p2').value;m.hidden=true;
  function err(t){m.textContent=L(t);m.hidden=false}
  if(p1.length<8)return err('رمز باید حداقل ۸ نویسه باشد');
  if(p1!==p2)return err('تکرار رمز با رمز اول یکی نیست');
  if(!$('#enc_ok').checked)return err('اول تیک «رمز را جای امن نوشته‌ام» را بزنید');
  var salt=e64(crypto.getRandomValues(new Uint8Array(16))),iter=600000,key;
  m.textContent=L('در حال رمزگذاری؛ چند ثانیه صبر کنید...');m.hidden=false;
  deriveKey(p1,salt,iter).then(function(k){key=k;return encObj(key,'hawala-ok')}).then(function(chk){
    var meta={v:1,salt:salt,iter:iter,chk:chk};
    return buildRecs('enc',key).then(function(b){
      return docRef().set({enc:JSON.stringify(meta),recs:b.recs,payload:firebase.firestore.FieldValue.delete(),by:fb.user.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).then(function(){
        b.rows.forEach(function(w){pushedTs[w[0]]=w[2]});
        E.key=key;E.saltId=salt;E.meta=meta;
        return keyPut({key:key,salt:salt});
      });
    });
  }).then(function(){closeSheet();render();toast(L('رمزگذاری فعال شد'))}).catch(function(){err('رمزگذاری ناموفق بود؛ اینترنت را بررسی و دوباره تلاش کنید')});
};

/* remittances */
A.saveRem=function(){
  clearErrs();
  var cur=stack[stack.length-1],c=co(cur.cid),edit=!!cur.rid,list=c[cur.kind];
  var v={
    no:toLatin($('#f_no').value).trim(),idCard:toLatin($('#f_idc').value).trim(),
    sender:$('#f_sender').value.trim(),receiver:$('#f_receiver').value.trim(),fatherName:$('#f_father').value.trim(),
    amount:Number(toLatin($('#f_amt').value).replace(/\D/g,'').slice(0,12))||0,place:$('#f_place').value.trim(),notes:$('#f_notes').value.trim(),
    phone:toLatin($('#f_phone').value).trim().slice(0,30),phoneType:($('#f_phone').dataset.t==='cu'?'cu':'hd'),
    date:''
  };
  var bad=false;
  (function(){
    var y=Number($('#f_y').value),m=Number($('#f_m').value),d=Number($('#f_d').value),g;
    if(db.dateFmt==='greg'){
      var t=new Date(y,m-1,d);
      if(t.getMonth()===m-1&&t.getDate()===d)v.date=isoOf([y,m,d]);
    }else{
      g=j2g(y,m,d);var b=g2j(g[0],g[1],g[2]);
      if(b[0]===y&&b[1]===m&&b[2]===d)v.date=isoOf(g);
    }
    if(!v.date){showErr('date',L('این تاریخ وجود ندارد؛ روز یا ماه را درست کنید'));bad=true}
  })();
  if(cur.kind==='read'&&!edit)v.no=pad4(nextNo(c));
  if(!v.no){showErr('f_no',L('شمارهٔ حواله را وارد کنید'));bad=true}
  else if(list.some(function(r){return r.id!==cur.rid&&toLatin(r.no).trim()===v.no})){showErr('f_no',L('این شماره قبلاً در همین لیست ثبت شده است'));bad=true}
  if(!v.sender){showErr('f_sender',L('نام فرستنده را وارد کنید'));bad=true}
  if(!v.receiver){showErr('f_receiver',L('نام گیرنده را وارد کنید'));bad=true}
  if(!v.amount){showErr('f_amt',L('مبلغ را به عدد وارد کنید'));bad=true}
  if(!v.place){showErr('f_place',L('محل پرداخت را وارد کنید'));bad=true}
  if(bad){var e1=document.querySelector('.field.err');if(e1)e1.scrollIntoView({block:'center'});return}
  requireAuth(function(){
  if(stack[stack.length-1]!==cur)return;
  if(edit){
    var r=list.find(function(x){return x.id===cur.rid});
    Object.assign(r,v,{edited:true,editedAt:nowISO(),editedBy:currentUserLabel(),updatedAt:nowISO()});clearCloudDeleted(cur.kind,cur.cid,r.id);
  }else{
    addrUsed(v.place);
    list.unshift(Object.assign({id:uid(),time:nowHM(),createdAt:nowISO(),updatedAt:nowISO(),shares:0,edited:false,editedAt:'',createdBy:currentUserLabel(),editedBy:''},v));
  }
  save();stack.pop();render();window.scrollTo(0,0);toast(L(edit?'تغییرات ذخیره شد':'حواله ثبت شد'));
  });
};
A.delRem=function(){
  var cur=stack[stack.length-1],c=co(cur.cid);
  var r=c[cur.kind].find(function(x){return x.id===cur.rid});
  confirmSheet({title:L('حذف حواله')+' '+D(r.no),msg:L('این حواله حذف می‌شود و جمع‌ها دوباره محاسبه می‌شوند.'),ok:'حذف حواله',danger:true},function(){
    requireAuth(function(){
    markCloudDeleted(cur.kind,cur.cid,r.id);c[cur.kind]=c[cur.kind].filter(function(x){return x.id!==r.id});save();stack.pop();render();toast(L('حواله حذف شد'));
    });
  });
};

  return _h2cReady;
}
function receiptBlob(c,r){

    host.innerHTML=receiptCardHTML(c,r);

    return window.html2canvas(host,{backgroundColor:'#050b1c',scale:2}).then(function(canvas){

    },function(){host.remove();return null});
  });

  f(el,e);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
A.addrDrop=function(){
  var d=$('#pdrop');if(!d)return;
  if(!d.hidden){d.hidden=true;return}
  var l=addrSorted();
  d.innerHTML=l.length?l.map(function(a){return '<button type="button" class="pit" data-act="addrPick" data-v="'+esc(a.n)+'">'+esc(a.n)+'</button>'}).join(''):'<div class="pem">'+L('هنوز آدرسی ثبت نشده؛ از تنظیمات اضافه کن')+'</div>';
  d.hidden=false;
};
A.phoneDrop=function(){
  var d=$('#phdrop'),i=$('#f_phone');if(!d||!i)return;
  if(!d.hidden){d.hidden=true;return}
  d.innerHTML=['hd','cu'].map(function(k){return '<button type="button" class="pit" data-act="phonePick" data-v="'+k+'">'+esc(L(PH_T[k]))+(i.dataset.t===k?' ✓':'')+'</button>'}).join('');
  d.hidden=false;
};
A.phonePick=function(el){
  var i=$('#f_phone'),d=$('#phdrop'),k=el.dataset.v==='cu'?'cu':'hd';
  i.dataset.t=k;$('#phLbl').textContent=L(PH_T[k])+' '+L('(اختیاری)');if(d)d.hidden=true;
  if(k==='hd'){if(db.myPhone)i.value=db.myPhone}else if(db.myPhone&&toLatin(i.value).trim()===db.myPhone)i.value='';
  i.focus();
};
A.addrPick=function(el){var i=$('#f_place');i.value=el.dataset.v;var d=$('#pdrop');if(d)d.hidden=true;var f=$('#fld_f_place');if(f)f.classList.remove('err');var m=$('#msg_f_place');if(m)m.hidden=true};
document.addEventListener('click',function(e){['pdrop','phdrop'].forEach(function(id){var d=document.getElementById(id);if(d&&!d.hidden&&!e.target.closest('.pw'))d.hidden=true})});
function addrStamp(){db.settingsUpdatedAt=nowISO();save()}
A.addrSheet=function(){
  closeAddrMenu();
  var tab=ui.addrTab==='phone'?'phone':'addr';
  var tabs='<div class="tabs no-print" style="margin:0 0 12px"><button class="'+(tab==='addr'?'on':'')+'" data-act="addrTab" data-t="addr">'+L('آدرس‌ها')+'</button><button class="'+(tab==='phone'?'on':'')+'" data-act="addrTab" data-t="phone">'+L('شماره حواله‌دار')+'</button></div>';
  if(tab==='phone'){
    openSheet('<h2 class="mh">'+L('آدرس‌های ثبت‌شده')+'</h2>'+tabs+'<p class="mu" style="margin:0 6px 12px">'+L('شمارهٔ حواله‌دار را یک بار اینجا ثبت کنید. هنگام ثبت حواله با زدن ^ و انتخاب «شماره حواله‌دار» خودکار پر می‌شود.')+'</p>'+
      '<div class="sgrp">'+field('my_phone','شمارهٔ حواله‌دار',db.myPhone||'',{ltr:true,num:true})+'</div>'+
      '<div class="btns"><button class="btn pri" data-act="savePhoneNo">'+L('ذخیره')+'</button></div>');
    return;
  }
  var l=addrSorted();
  openSheet('<h2 class="mh">'+L('آدرس‌های ثبت‌شده')+'</h2>'+tabs+'<p class="mu" style="margin:0 6px 12px">'+L('این آدرس‌ها هنگام ثبت حواله در فهرست «محل پرداخت» پیشنهاد می‌شوند. آدرس پرکاربردتر بالاتر می‌آید.')+'</p>'+
    '<div class="sgrp">'+(l.length?l.map(function(a){return '<div class="arow"><span>'+esc(a.n)+(a.c?' <small class="mu">('+D(a.c)+')</small>':'')+'</span><button class="adots" data-act="addrMenu" data-v="'+esc(a.n)+'" aria-label="'+esc(L('گزینه‌ها'))+'"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></div>'}).join(''):'<div class="pem">'+L('هنوز آدرسی ثبت نشده')+'</div>')+'</div>'+
    '<div class="sgrp">'+field('ad_new','آدرس تازه','')+'</div>'+
    '<div class="btns"><button class="btn pri" data-act="addrAdd">'+L('افزودن')+'</button></div>');
};
A.addrTab=function(el){ui.addrTab=el.dataset.t==='phone'?'phone':'addr';A.addrSheet()};
A.savePhoneNo=function(){
  db.myPhone=toLatin($('#my_phone').value).trim().slice(0,30);addrStamp();toast(L('ذخیره شد'));
};
A.addrAdd=function(){
  var v=$('#ad_new').value.trim().slice(0,100);if(!v)return;
  if(!db.addrs.some(function(a){return a.n.toLowerCase()===v.toLowerCase()}))db.addrs.push({n:v,c:0});
  addrStamp();A.addrSheet();
};
A.addrDel=function(el){
  closeAddrMenu();
  db.addrs=db.addrs.filter(function(a){return a.n!==el.dataset.v});addrStamp();A.addrSheet();
};
function closeAddrMenu(){var m=document.getElementById('amenu');if(m)m.remove()}
A.addrMenu=function(el){
  var open=document.getElementById('amenu');
  if(open){var same=open.getAttribute('data-for')===el.dataset.v;closeAddrMenu();if(same)return}
  var r=el.getBoundingClientRect(),m=document.createElement('div');
  m.id='amenu';m.className='amenu no-print';m.setAttribute('data-for',el.dataset.v);
  m.innerHTML='<button class="aopt" data-act="addrEdit" data-v="'+esc(el.dataset.v)+'">'+esc(L('ویرایش'))+'</button>'+
    '<button class="aopt dng" data-act="addrDel" data-v="'+esc(el.dataset.v)+'">'+esc(L('حذف'))+'</button>';
  document.body.appendChild(m);
  var w=m.offsetWidth,h=m.offsetHeight,left=Math.max(8,Math.min(r.left,window.innerWidth-w-8)),top=r.bottom+4;
  if(top+h>window.innerHeight-8)top=Math.max(8,r.top-h-4);
  m.style.left=left+'px';m.style.top=top+'px';
};
document.addEventListener('click',function(e){if(document.getElementById('amenu')&&!e.target.closest('#amenu')&&!e.target.closest('.adots'))closeAddrMenu()});
window.addEventListener('scroll',closeAddrMenu,true);
A.addrEdit=function(el){
  closeAddrMenu();
  var old=el.dataset.v;
  openSheet('<h2 class="mh">'+L('ویرایش آدرس')+'</h2>'+
    '<div class="sgrp">'+field('ad_edit','آدرس',old)+'</div>'+
    '<div class="btns"><button class="btn pri" data-act="addrEditGo" data-v="'+esc(old)+'">'+L('ذخیره')+'</button><button class="btn" data-act="addrSheet">'+L('انصراف')+'</button></div>');
  var i=$('#ad_edit');if(i)setTimeout(function(){i.focus();try{i.setSelectionRange(i.value.length,i.value.length)}catch(e){}},60);
};
A.addrEditGo=function(el){
  clearErrs();
  var old=el.dataset.v,v=$('#ad_edit').value.trim().slice(0,100);
  if(!v){showErr('ad_edit',L('این مقدار لازم است'));return}
  var cur=db.addrs.find(function(a){return a.n===old});
  if(!cur){A.addrSheet();return}
  if(v!==old&&db.addrs.some(function(a){return a!==cur&&a.n.toLowerCase()===v.toLowerCase()})){showErr('ad_edit',L('این آدرس قبلاً ثبت شده'));return}
  cur.n=v;addrStamp();A.addrSheet();
};
/* phone back button: one step back like the "<" button; menus first; twice on home to exit */
var exitArm=0;
try{history.replaceState({hw:0},'')}catch(e){}
/* Chrome skips history entries a page adds without a user gesture, so the extra "back" entry is added on the
   first touch/tap (and re-added whenever it is missing), never at load */
function armBack(){try{if(!history.state||history.state.hw!==1)history.pushState({hw:1},'')}catch(e){}}
document.addEventListener('pointerdown',armBack,true);
document.addEventListener('touchstart',armBack,{capture:true,passive:true});
document.addEventListener('click',armBack,true);
window.addEventListener('popstate',function(){
  if(document.getElementById('lockGate')||document.getElementById('encGate')||document.getElementById('loginGate')){try{history.pushState({hw:1},'')}catch(e){}return}
  if(sheetEl){try{history.pushState({hw:1},'')}catch(e){}closeSheet();return}
  if(stack.length>1){try{history.pushState({hw:1},'')}catch(e){}navBack();return}
  if(Date.now()-exitArm<2500){exitArm=0;history.back();return}
  exitArm=Date.now();try{history.pushState({hw:1},'')}catch(e){}toast('برای خروج دوباره بزنید');
});

if(!storageOk)setTimeout(function(){toast('ذخیره‌سازی مرورگر فعال نیست؛ پشتیبان بگیرید')},600);
var lockOn=loadLockCfg().enabled;
if(lockOn)document.documentElement.classList.add('locked');
render();
if(lockOn)showLockGate();
if(cloudEnabled())initCloud();
(function(){
  var s=document.getElementById('splash');
  if(s){s.style.opacity='0';setTimeout(function(){s.remove()},300)}
})();
})();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
